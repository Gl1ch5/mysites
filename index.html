<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vintage iOS Homepage</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Apple Touch Icons for iOS home screen -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div class="device-wrapper">
    <div class="status-bar">
        <span>No Service</span>
        <span>12:00 PM</span>
        <span>100% 🔋</span>
    </div>

    <!-- Invisible trigger area for secret admin panel -->
    <div id="secretTrigger" class="secret-trigger" title="Secret Area"></div>

    <div class="home-screen" id="homeScreen">
        <a href="#" class="app-icon" onclick="alert('Messages App is under construction.')">
            <div class="icon-graphic app-mail">💬</div>
            <span>Messages</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Calendar App is under construction.')">
            <div class="icon-graphic app-safari">📅</div>
            <span>Calendar</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Photos App is under construction.')">
            <div class="icon-graphic app-photos">🌻</div>
            <span>Photos</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Camera App is under construction.')">
            <div class="icon-graphic app-settings">📷</div>
            <span>Camera</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Weather App is under construction.')">
            <div class="icon-graphic app-mail">⛅</div>
            <span>Weather</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Clock App is under construction.')">
            <div class="icon-graphic app-settings">⏰</div>
            <span>Clock</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Maps App is under construction.')">
            <div class="icon-graphic app-safari">🗺️</div>
            <span>Maps</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Videos App is under construction.')">
            <div class="icon-graphic app-mail">🎬</div>
            <span>Videos</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Notes App is under construction.')">
            <div class="icon-graphic app-photos">📝</div>
            <span>Notes</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Reminders App is under construction.')">
            <div class="icon-graphic app-settings">📌</div>
            <span>Reminders</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Stocks App is under construction.')">
            <div class="icon-graphic app-safari">📈</div>
            <span>Stocks</span>
        </a>
        <a href="#" class="app-icon" onclick="alert('Game Center App is under construction.')">
            <div class="icon-graphic app-mail">🕹️</div>
            <span>Game Center</span>
        </a>
    </div>

    <div class="dock">
        <a href="#" class="app-icon" onclick="alert('Phone App is under construction.')">
            <div class="icon-graphic app-settings">📞</div>
        </a>
        <a href="#" class="app-icon" onclick="alert('Mail App is under construction.')">
            <div class="icon-graphic app-mail">✉️</div>
        </a>
        <a href="#" class="app-icon" onclick="alert('Safari App is under construction.')">
            <div class="icon-graphic app-safari">🧭</div>
        </a>
        <a href="#" class="app-icon" onclick="alert('Music App is under construction.')">
            <div class="icon-graphic app-photos">🎵</div>
        </a>
    </div>

</div>

<script src="js/main.js"></script>
</body>
</html>
